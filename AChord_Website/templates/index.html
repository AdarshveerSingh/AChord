<!DOCTYPE html>
<html>
<head>
    <link href="https://db.onlinewebfonts.com/c/f69ff86e79388ae1f8ab4cb56d45a0d3?family=Architype+Van+Der+Leck+W90" rel="stylesheet">
    <title>AChord</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/AChord Logo Short.png') }}">
    <style>
        @font-face {
            font-family: 'ArchiType Van';
            src: url('/static/fonts/VanDoesburgArchiType Regular.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Archive';
            src: url('/static/fonts/Archive Regular.ttf') format('truetype');
        }
        body {
            font-family: "Archive", sans-serif;
            background: #ffbe73;
            color: white;
            text-align: center;
        }

        input {
            padding: 12px;
            width: 300px;
            border-radius: 8px;
            border: none;
            margin: 10px;
        }
    #searchResults {
        position: absolute;
        top: 320px;
        left: 800px; 

        width: 320px;
        max-height: 400px;

        background-color: #17181d;
        border: #282626 solid 18px;
        border-radius: 20px;
        box-shadow: 50px 40px 0px 0px #fa8907;
        overflow-y: auto;  
        padding: 10px;

        transform: translateX(-120%);
        opacity: 0;

        transition: all 0.4s ease;
        z-index: 999;
    }


    #searchResults.active {
        transform: translateX(0);
        opacity: 1;
    }
    .search-result {
        cursor: pointer;
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 5px;
        color: #ffffff;
    }

    .search-result:hover {
        background: #242424;
        color: #ffa53f;
    }
    #searchResults::-webkit-scrollbar {
        width: 6px;
    }

    #searchResults::-webkit-scrollbar-thumb {
        background: #ffab4a;
        border-radius: 10px;
    }
        .card {
            background: #ffbe73;
            margin: 0px;
            padding: 0px;
            width: 100%;
            border-radius: 10px;
        }

        img {
            border-radius: 10px;
        }

        a {
            color: #1db954;
        }
        
        #searchBox{
            position: absolute;
            bottom: 304.0px;
            left: 450.7px;
            padding: 7px;
            border-radius: 43px;
            background-color: black;
            color: #ffb055;
            border: 3px dashed #ffb055;
            height: 67.5px;
            width: 330.7px;
            font-size: 25px;
            padding-left: 14px;
            font-family: "Architype Van";
            z-index: 999;

        }
        #boombox{
            position: absolute;
            bottom: -75.7px;
            right: 700.7px;
            background-color: #17181d;
            border: #282626 solid 18px;
            border-radius: 57px;
            width: 924.4px;
            height: 521.9px;
            box-shadow: 50px 40px 0px 0px #fa8907;
            z-index: 0;
        }
        #underbar{
            font-size: 20px;
            position: absolute;
            left: 637.4px;
            top: 214px;
            color: #ffb055;
        }
        #Vinyl{
            position: absolute;
            left: -241.1px;
            top: 20px;
            height: 462.2px;
            animation: spin 7s linear infinite;
            transform-origin: center;
            
        }
        #generate{
            font-family: 'Archive';
            font-size: 25px;
            position: absolute;
            left: 448.9px;
            border: #000000 solid 2px;
            border-radius: 20px;
            top: 254px;
            color: #000000;
            background-color: #ffbb6e;
            width: 406.6px;
            height: 67.9px;
        }
        #generate:hover{
            background-color: #000000;
            border: none;
            transform: scale(1.04);
            color: #ffb055;
            transition: 340ms ease-in-out;
        }
        .card_rec {
            position: relative;

            width: 452.5px;
            height: 284px;
            border: none;
            border-radius: 20px;
            margin-bottom: -200px;   /* 🔥 overlap stack */
    
            transform: translateX(200px); /* 👈 push off-screen */

            transition: transform 0.4s ease;

            
            cursor: pointer;
}
.card_rec:nth-child(1) { transform: translateX(200px); z-index: 5; }
.card_rec:nth-child(2) { transform: translateX(220px); z-index: 4; }
.card_rec:nth-child(3) { transform: translateX(240px); z-index: 3; }
.card_rec:nth-child(4) { transform: translateX(260px); z-index: 2; }
.card_rec:nth-child(5) { transform: translateX(280px); z-index: 1; }
#recommendations a:nth-child(1) .card_rec {
    box-shadow: -50px 34px 0px 0px #fad5aa;
}

#recommendations a:nth-child(2) .card_rec {
    box-shadow: -50px 34px 0px 0px #ffbe73;
}

#recommendations a:nth-child(3) .card_rec {
    box-shadow: -50px 34px 0px 0px #ffb662;
}

#recommendations a:nth-child(4) .card_rec {
    box-shadow: -50px 34px 0px 0px #ffa53f;
}

#recommendations a:nth-child(5) .card_rec {
    box-shadow: -50px 34px 0px 0px #fa8907;
}
.card_rec .info {
    margin-left: 15px;
    text-align: left;
}
.card_rec:hover ~ .card_rec {
    transform: translateX(300px); /* push others further right */
}
.card_rec:hover {
    transform: translateX(-70px) scale(1.02);
}
/* 🎵 SONG NAME (TOP BLACK STRIP) */
.song-name {
    position: absolute;
    top: 45px;
    left: 20px;
    right: 20px;
    margin-left: 20px;
    margin-right: 20px;
    background-color: #ffffff;
    color: rgb(0, 0, 0);
    font-size: 100%;
    border: none;
    border-radius: 20px;
    font-weight: bold;

    text-align: center;
    z-index: 2;
}

/* 🎤 ARTISTS (BOTTOM ORANGE STRIP) */
.song-artists {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;

    background-color: #ffbe73;
    color: black;
    font-size: 16px;
    font-weight: bold;

    text-align: center;
    z-index: 2;
}

#logo img{
    position: absolute;
    height: 340px;
    width: 529px;
    left: -70px;
    top: -70px;
}

#recommendationsContainer {
    position: absolute;
    right: 70px;
    top: 60px;

    width: 500px;
}
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
}
    </style>
</head>
<body>
    <div id="logo">
        <img src="{{ url_for('static', filename='images/AChord Logo.png') }}" alt="AChord Logo">
    </div>
<div id="boombox">
    <img src="{{ url_for('static', filename='images/vinyl.png') }}" alt="" id="Vinyl">
    <input type="text" id="searchBox" placeholder="type song here...." onkeyup="searchSongs()">
    <span id="underbar">current track <track></track></span>
    <button id="generate" onclick="searchSongs()">Generate</button>
</div>
<div id="searchResults"></div>


<div id="recommendationsContainer">
    <div id="recommendations"></div>
</div>

<script>
async function searchSongs() {
    let query = document.getElementById("searchBox").value;

    if (query.length < 2) {
        document.getElementById("searchResults").innerHTML = "";
        document.getElementById("searchResults").classList.remove("active");
        return;
    }

    let res = await fetch(`/search?q=${query}`);
    let data = await res.json();

    let html = "";
    data.results.forEach(song => {
        html += `
        <div class="search-result" 
            onclick="recommend('${song.name}', '${song.artists[0]}')">
            ${song.name} - ${song.artists.join(", ")}
        </div>`;
    });

    const resultsBox = document.getElementById("searchResults");
    resultsBox.innerHTML = html;
    resultsBox.classList.add("active");
}

async function recommend(song, artist) {
    document.getElementById("searchResults").innerHTML = "";
    document.getElementById("searchResults").classList.remove("active");

    let res = await fetch("/recommend", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            song: song,
            artist: artist
        })
    });

    let data = await res.json();

    let html = "";
    data.forEach(s => {
        html += `
        <a href="${s.url}" target="_blank">
        <div class="card_rec" style="background-image: url('${s.image}')">
            <img src="/static/images/cassettes.png" 
                 style="position:absolute;width:452.5px;height:289px;z-index:0;right:0px">
            <div class="song-name">${s.name}</div>
            <div class="song-artists">${s.artists}</div>
        </div>
        </a>
        `;
    });

    document.getElementById("recommendations").innerHTML = html;
}
</script>

</body>
</html>
